services:
  mychef:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Opcional: Gemini lee las fotos (facturas, nevera, recetas) y OpenAI el texto y la voz.
      # Los modelos se eligen en Ajustes → Casa y tareas.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Opcional: PIN de la casa (recomendado si la app queda publicada en internet)
      - MYCHEF_PIN=${MYCHEF_PIN:-}
      - MYCHEF_SECRET=${MYCHEF_SECRET:-}
      # Opcional: usar PostgreSQL en vez del archivo SQLite de ./data
      # - MYCHEF_DATABASE_URL=postgresql://usuario:clave@servidor:5432/mychef
      # Opcional: guardar las fotos de la familia en MinIO / S3 en vez de ./data/photos
      # - MYCHEF_S3_ENDPOINT=https://minio.midominio.com
      # - MYCHEF_S3_ACCESS_KEY=...
      # - MYCHEF_S3_SECRET_KEY=...
      # - MYCHEF_S3_BUCKET=mychef
      # Opcional: agenda sincronizada con el calendario de Google. Basta con poner la clave de la
      # cuenta de servicio en ./data/google.json (si no está, la agenda funciona sin Google).
      - MYCHEF_GOOGLE_CREDENTIALS=${MYCHEF_GOOGLE_CREDENTIALS:-/data/google.json}
      # Zona horaria de la casa (para saber qué día es y a qué hora recordar las tareas)
      - MYCHEF_TZ=${MYCHEF_TZ:-America/Bogota}
    volumes:
      - ./data:/data
    restart: unless-stopped
