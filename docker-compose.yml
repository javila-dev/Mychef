services:
  mychef:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Opcional: habilita reconocer la despensa y recetas por foto
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Opcional: PIN de la casa (recomendado si la app queda publicada en internet)
      - MYCHEF_PIN=${MYCHEF_PIN:-}
      - MYCHEF_SECRET=${MYCHEF_SECRET:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
