# Producción (Dokploy). Los dominios y el HTTPS se configuran en Dokploy → Domains apuntando al
# servicio «mychef», puerto 8000. Las variables van en Dokploy → Environment (ver .env.example).
#
# No publica puertos: Traefik le llega por la red de Dokploy. Para correrlo a mano en un computador
# de la casa, agreguen   ports: ["8000:8000"]   al servicio.

services:
  mychef:
    build: .
    expose:
      - "8000"
    environment:
      # IA: Gemini lee las fotos (facturas, nevera, recetas); OpenAI es opcional para el texto.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Entrar con usuario y contraseña: obligatorio, sin ellos no despliega (la app queda en internet)
      - MYCHEF_USER=${MYCHEF_USER:?Falta MYCHEF_USER}
      - MYCHEF_PASSWORD=${MYCHEF_PASSWORD:?Falta MYCHEF_PASSWORD}
      - MYCHEF_SECRET=${MYCHEF_SECRET:?Falta MYCHEF_SECRET (cadena larga y aleatoria)}
      # Opcional: PostgreSQL en vez del SQLite del volumen
      - MYCHEF_DATABASE_URL=${MYCHEF_DATABASE_URL:-}
      # Opcional: fotos de la familia en MinIO / S3 en vez del volumen
      - MYCHEF_S3_ENDPOINT=${MYCHEF_S3_ENDPOINT:-}
      - MYCHEF_S3_ACCESS_KEY=${MYCHEF_S3_ACCESS_KEY:-}
      - MYCHEF_S3_SECRET_KEY=${MYCHEF_S3_SECRET_KEY:-}
      - MYCHEF_S3_BUCKET=${MYCHEF_S3_BUCKET:-mychef}
      # Opcional: agenda con Google Calendar (contenido del JSON de la cuenta de servicio, o ruta)
      - MYCHEF_GOOGLE_CREDENTIALS=${MYCHEF_GOOGLE_CREDENTIALS:-/data/google.json}
      - MYCHEF_GOOGLE_CALENDAR_ID=${MYCHEF_GOOGLE_CALENDAR_ID:-}
      # Zona horaria de la casa
      - MYCHEF_TZ=${MYCHEF_TZ:-America/Bogota}
    volumes:
      - mychef-data:/data
    networks:
      - dokploy-network   # Traefik (las etiquetas las pone Dokploy al configurar el dominio)
      - shared-services   # PostgreSQL central (central-postgres) y MinIO (minio)
    restart: unless-stopped

volumes:
  mychef-data:

networks:
  dokploy-network:
    external: true
  shared-services:
    external: true
